<section class="section-padrao section-padrinhos" appScrollReveal>
    <div class="cabecalho">
        <p class="subtitulo">Nossos Padrinhos</p>
        <h1>Conheça as pessoas que fazem parte da nossa história</h1>
    </div>

    <div class="carrossel">

        <button class="seta" (click)="paginaAnterior()" [disabled]="paginaAtual === 0">
            <span class="material-symbols-outlined">
                chevron_left
            </span>
        </button>

        <div class="galeria-padrinhos" [class.trocando]="animando">

            @for (padrinho of padrinhosVisiveis; track padrinho.nome) {
                <div class="padrinhos">
                    <div class="moldura">
                        <img [src]="padrinho.foto" [alt]="padrinho.nome">
                    </div>

                    <h3>{{ padrinho.nome }}</h3>
                </div>
            }

        </div>

        <button class="seta" (click)="proximaPagina()" [disabled]="paginaAtual === 1">
            <span class="material-symbols-outlined">
                chevron_right
            </span>
        </button>

    </div>

    <div class="indicadores">
        <span [class.ativo]="paginaAtual === 0"></span>
        <span [class.ativo]="paginaAtual === 1"></span>
    </div>

    <h1>Damas</h1>

    <div class="galeria-damas">
        <div class="padrinhos">
            <div class="moldura"><img src="images/padrinhos/dama1.jpg" alt=""></div>
            <h3>Rebecca</h3>
        </div>
        <div class="padrinhos">
            <div class="moldura"><img src="images/padrinhos/dama2.jpg" alt=""></div>
            <h3>Raquel</h3>
        </div>
        <div class="padrinhos">
            <div class="moldura"><img src="images/padrinhos/dama3.jpg" alt=""></div>
            <h3>Bia</h3>
        </div>
    </div>
</section>
